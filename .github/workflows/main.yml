
name: Build Neon Glass Music HUD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-glass-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Minecraft 26.3 Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"

      - name: Find project
        id: project
        shell: bash
        run: |
          if [ -f build.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f NeonGlassMusicHUD/build.gradle ]; then
            echo "dir=NeonGlassMusicHUD" >> "$GITHUB_OUTPUT"
          else
            echo "::error::build.gradle not found"
            exit 1
          fi

      - name: Build mod
        run: gradle build --no-daemon
        working-directory: ${{ steps.project.outputs.dir }}

      - name: Upload mod JAR
        uses: actions/upload-artifact@v6
        with:
          name: Neon-Glass-Music-HUD-26.3
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
            !${{ steps.project.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
